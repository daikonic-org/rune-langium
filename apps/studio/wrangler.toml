#
# Cloudflare Pages project config for the Rune Studio (spec 019 + 018).
# Pages serves apps/studio/dist as static assets; functions in
# apps/studio/functions/ are deployed alongside.
#
# LSP is served directly by the standalone `rune-lsp-worker` Cloudflare
# Worker (apps/lsp-worker/), at its own zone route
# (www.daikonic.dev/rune-studio/api/lsp/*) — not proxied through a Pages
# Function. An earlier same-origin proxy layer (apps/studio/functions/api/
# lsp/*, binding LSP_SESSION → rune-lsp-worker's Durable Object namespace)
# was deleted: it duplicated apps/lsp-worker's session-mint/health/WS-
# upgrade logic for no remaining benefit once both Pages and apps/lsp-worker
# deploy the same way (Cloudflare's git integration, auto on push to
# master). See apps/studio/src/config.ts's defaultLspWsUrl/
# defaultLspSessionUrl for the client-side URL routing.

name = "rune-studio"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

# Curated mirror service binding — /api/parse calls into the curated-mirror
# Worker via this binding instead of a same-zone HTTP fetch().
#
# Why a binding instead of fetch("https://www.daikonic.dev/curated/..."):
# when a Pages Function does an HTTP subrequest to its own zone, CF stamps a
# `cf-worker: daikonic-dev.pages.dev` header and the request gets routed
# back to the Pages project's static assets (which 404 on /curated/...)
# rather than to the curated-mirror Worker that owns the route binding —
# CF's same-zone loop prevention. A service binding bypasses zone routing
# entirely: env.CURATED_MIRROR.fetch(url) is a direct Worker-to-Worker
# in-process call.
[[services]]
binding = "CURATED_MIRROR"
service = "rune-curated-mirror-worker"

[[services]]
binding = "CDM_EXECUTION"
service = "rune-cdm-example-data"
entrypoint = "DatabaseExecution"

# Allowlist for LSP session origin gating. This config is LOCAL DEV only
# (`pnpm dev:pages` against `http://localhost:5173` + `http://localhost:8788`),
# so we include the dev origins by default. Production binding lives in the
# CF Pages dashboard / the generated <repo>/wrangler.toml (which has the
# wildcard pattern for preview subdomains).
[vars]
ALLOWED_ORIGIN = "http://localhost:5000,http://127.0.0.1:5000,http://localhost:5173,http://localhost:8788,https://www.daikonic.dev,https://*.replit.dev"
