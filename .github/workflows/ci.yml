name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    # Keep both complete suites under independent job budgets, sharing setup.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint-and-test
            script: test
          - check: coverage
            script: test:coverage

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Use project Node.js LTS
        # Tooling uses the shared LTS pin. Cloudflare runs workerd/V8 with
        # API compatibility controlled independently by its date and flags.
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use Python 3.13 for projection execution tests
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install XML Schema validator for generated XSD tests
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Determine CDM fixture cache key
        id: fixture-versions
        run: |
          CDM_TAG=$(grep -m1 '^CDM_TAG=' scripts/update-fixtures.sh | cut -d'"' -f2)
          RUNE_TAG=$(grep -m1 '^RUNE_TAG=' scripts/update-fixtures.sh | cut -d'"' -f2)
          FPML_TAG=$(grep -m1 '^FPML_TAG=' scripts/update-fixtures.sh | cut -d'"' -f2)
          echo "cdm-tag=$CDM_TAG" >> "$GITHUB_OUTPUT"
          echo "rune-tag=$RUNE_TAG" >> "$GITHUB_OUTPUT"
          echo "fpml-tag=$FPML_TAG" >> "$GITHUB_OUTPUT"
          echo "cache-key=fixtures-cdm-${CDM_TAG}-rune-${RUNE_TAG}-fpml-${FPML_TAG}" >> "$GITHUB_OUTPUT"

      - name: Cache CDM / Rune DSL / Rune FpML fixtures
        id: fixture-cache
        uses: actions/cache@v6
        with:
          path: .resources
          key: ${{ steps.fixture-versions.outputs.cache-key }}

      - name: Download CDM / Rune DSL / Rune FpML fixtures
        if: steps.fixture-cache.outputs.cache-hit != 'true'
        run: bash scripts/update-fixtures.sh

      - name: Generate Langium artifacts
        run: pnpm run generate
        continue-on-error: true

      - name: Build
        run: pnpm run build:ci
        timeout-minutes: 15

      - name: Verify versioned native implementation inventory
        if: matrix.check == 'lint-and-test'
        run: pnpm run verify:native-implementations
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify curated release reconciliation and publication
        if: matrix.check == 'lint-and-test'
        run: node --test scripts/lib/curated-sources.test.mjs scripts/lib/curated-releases.test.mjs scripts/reconcile-curated-releases.test.mjs scripts/upload-serialized-artifacts.test.mjs

      - name: Verify complete reference example corpus
        if: matrix.check == 'lint-and-test'
        run: pnpm run verify:reference-examples

      - name: Upload reference example inventory
        if: always() && matrix.check == 'lint-and-test'
        uses: actions/upload-artifact@v7
        with:
          name: reference-example-import-inventory
          path: dist/reference-example-import-report.json
          if-no-files-found: error

      - name: Type check
        if: matrix.check == 'lint-and-test'
        run: pnpm run type-check

      - name: Validate design-sync previews and generated contracts
        if: matrix.check == 'lint-and-test'
        run: |
          pnpm exec tsc --project .design-sync/tsconfig.json
          node --test .design-sync/prepare-config.test.mjs
          pnpm --filter @rune-langium/visual-editor exec vitest run --config ../../.design-sync/vitest.config.ts

      - name: Lint
        if: matrix.check == 'lint-and-test'
        run: pnpm run lint

      - name: Format check
        if: matrix.check == 'lint-and-test'
        run: pnpm run format:check
        continue-on-error: true

      - name: Test curated publication policy and ordering
        if: matrix.check == 'lint-and-test'
        run: node --test scripts/lib/curated-sources.test.mjs scripts/lib/curated-releases.test.mjs scripts/upload-serialized-artifacts.test.mjs scripts/lib/dependency-automerge.test.mjs

      - name: Verify dependency security patches
        if: matrix.check == 'lint-and-test'
        run: node --test scripts/braces-patch.test.mjs

      - name: Verify CLI and LSP publication dependencies
        if: matrix.check == 'lint-and-test'
        run: node --test scripts/package-publication.test.mjs

      - name: Test
        run: pnpm run ${{ matrix.script }}

      - name: Upload coverage to Codecov
        if: matrix.check == 'coverage'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Security Audit
        if: matrix.check == 'lint-and-test'
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Check Studio Bundle Size (019 Phase 2)
        if: matrix.check == 'lint-and-test'
        run: pnpm --filter @rune-langium/studio run bundle-size
        # Soft-disabled 2026-05-14: ExcelJS + JSZip (PRs #167-#169) pushed
        # the bundle over the configured limit; the check still runs and
        # reports the size in CI logs, but the job no longer fails on it.
        # Re-enable by removing this `continue-on-error` line once the
        # bundle is back under the threshold (lazy-load ExcelJS, etc.).
        continue-on-error: true
        env:
          STUDIO_MAX_BUNDLE_BYTES: ${{ vars.STUDIO_MAX_BUNDLE_BYTES }}

  # ---------------------------------------------------------------------------
  # studio-a11y: browser accessibility and pre-deployment Studio UX gate.
  #
  # Runs Playwright headlessly on a single Node version, executes the e2e
  # suite at apps/studio/test/e2e/a11y.spec.ts, and fails the job on any
  # 'serious' or 'critical' violation in code we own. Monaco / ReactFlow
  # / dockview surfaces are excluded inside the spec — their a11y posture
  # is upstream's responsibility per FR-A04.
  # The optimized candidate UX suite also checks the public workflows and
  # focused reading-space/diagnostic cases before merge, retaining its evidence.
  #
  # Why a separate job: keeps the unit-test job fast on the matrix (no
  # browser install per Node version) and makes a11y regressions easy to
  # find in the checks list.
  # ---------------------------------------------------------------------------
  studio-a11y:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Use project Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use Ubuntu HTTPS package mirrors
        # The runner's priority-1 Azure HTTP mirror can hang inside apt update:
        # https://github.com/actions/runner-images/issues/14594
        # Retain the image's official archive/security fallback mirrors and priorities.
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          fi

      - name: Install Playwright browsers (chromium only)
        run: pnpm --filter @rune-langium/studio exec playwright install --with-deps chromium

      - name: Build studio + workspace dependencies
        # `...` suffix builds the studio's workspace deps first (design-tokens
        # emits dist/tokens.css, core emits the AST types). Without it, the
        # studio build can't resolve @rune-langium/design-tokens/tokens.css
        # or @rune-langium/core from the parser worker.
        run: pnpm --filter '@rune-langium/studio...' run build

      - name: Run axe-core a11y gate
        # Invoke playwright directly via `exec` so the --grep flag isn't
        # routed through the pnpm-script `--` boundary (which made
        # playwright interpret "--grep" as a test-file path).
        run: pnpm --filter @rune-langium/studio exec playwright test --grep "Studio a11y"

      - name: Review candidate Studio UX before deployment
        # The shared harness substitutes only this build's static assets. Public
        # hosted APIs remain real; canonical freshness is checked after deploy.
        run: pnpm --filter @rune-langium/studio run test:ux-candidate
        env:
          # Public source reads share the runner IP's tiny anonymous GitHub quota.
          # The Node-only transport scopes this credential to public CDM GETs.
          STUDIO_TEST_GITHUB_TOKEN: ${{ github.token }}

      - name: Redact candidate UX credentials
        id: redact-ux
        if: always()
        run: node apps/studio/scripts/redact-test-artifacts.mjs dist/ux-candidate

      - name: Upload candidate UX evidence
        if: always() && steps.redact-ux.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: studio-ux-candidate
          path: dist/ux-candidate
          if-no-files-found: error

      - name: Verify Inspector schema hot reload
        run: pnpm --filter @rune-langium/studio run test:z2f-hmr

      - name: Studio memory regression check (019 Phase 2)
        # Skipped at runtime when STUDIO_MEMORY_BASELINE_BYTES is unset
        # (e.g. before the first capture). Once set in repo vars, the
        # gate fires and compares CDM-corpus heap usage against
        # baseline + 5% headroom.
        run: pnpm --filter @rune-langium/studio exec playwright test --grep "Studio browser memory regression"
        env:
          STUDIO_MEMORY_BASELINE_BYTES: ${{ vars.STUDIO_MEMORY_BASELINE_BYTES }}

  # ---------------------------------------------------------------------------
  # check-generated: Verify generated schema files don't drift from source (T039, FR-018, SC-008)
  #
  # Runs generate:schemas, normalises formatting, then fails if any committed
  # generated file differs from the freshly-regenerated output.
  #
  # Note: form scaffolding is no longer a separate step (012-studio-workspace-ux,
  # T104–T108). Forms are emitted at Vite build time via `?z2f` virtual modules
  # served by `@zod-to-form/vite`; nothing checked-in needs regenerating in CI.
  # ---------------------------------------------------------------------------
  check-generated:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Use project Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate Zod schemas from Langium grammar
        run: pnpm --filter @rune-langium/visual-editor generate:schemas

      - name: Assert no drift between committed and freshly-generated schemas
        run: git diff --exit-code -- packages/visual-editor/src/generated/

      - name: Regenerate domain surface from Langium grammar
        run: pnpm --filter @rune-langium/core generate:domain

      - name: Assert no drift in generated domain surface
        run: git diff --exit-code -- packages/core/src/generated/domain.ts
