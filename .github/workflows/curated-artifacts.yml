name: Curated Serialized Artifacts
run-name: ${{ github.event_name == 'push' && 'Curated release — audited implementations' || inputs.cdm_release && format('Curated release — CDM {0}', inputs.cdm_release) || 'Curated Nightly — CDM master' }}

# Catalog read/modify/write and moving pointers must not race another publisher.
concurrency:
  group: curated-publication
  queue: max

# Build pre-parsed Langium artifacts for curated models (CDM, FpML, rune-dsl).
#
# This workflow is the SINGLE source of truth for the curated v2 manifest
# (the per-namespace dependency graph) and the serialized artifacts the live
# load path consumes (/api/parse reads manifest.namespaces +
# artifacts.serializedWorkspace; the browser path fetches latest.serialized.json.gz).
# It downloads source archives from codeload.github.com (upstream) directly and
# parses CDM through Langium with 4GB+ heap — the curated-mirror Worker can't do
# this (it OOMs on CDM) and its publish cron is now DISABLED, so this Action owns
# manifest + artifact freshness end to end.
#
# Triggers:
#   - Nightly at 04:00 UTC
#   - Manual dispatch
#   - Audited implementation or publisher changes on master

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/curated-artifacts.yml'
      - 'packages/project-runtime/src/curated-implementations/**'
      - 'packages/project-runtime/src/code-lists.ts'
      - 'scripts/fixtures/native-implementation-sources.json'
      - 'scripts/build-serialized-artifacts.mjs'
      - 'scripts/lib/curated-sources.mjs'
      - 'scripts/lib/curated-releases.mjs'
      - 'scripts/upload-serialized-artifacts.sh'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      cdm_release:
        description: CDM GitHub release tag; leave blank for Nightly (upstream master)
        required: false
        type: string

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # Queued or retried push runs should publish the latest merged implementations.
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Use project Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build curated publication dependencies
        id: build-core
        run: pnpm --filter '@rune-langium/project-runtime...' run build

      - name: Reconcile newly published CDM releases
        if: ${{ github.event_name != 'push' && !inputs.cdm_release }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reconcile-curated-releases.mjs

      - name: Build serialized artifacts
        id: build-artifacts
        # A release failure stays red but must not prevent the independent Nightly build.
        if: ${{ !cancelled() && steps.build-core.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CDM_RELEASE: ${{ inputs.cdm_release }}
        run: |
          set -e
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            node --max-old-space-size=4096 scripts/build-serialized-artifacts.mjs --release-pins scripts/fixtures/native-implementation-sources.json
          elif [[ -n "$CDM_RELEASE" ]]; then
            node --max-old-space-size=4096 scripts/build-serialized-artifacts.mjs --release "$CDM_RELEASE"
          else
            node --max-old-space-size=4096 scripts/build-serialized-artifacts.mjs
          fi

      - name: Upload artifacts to R2
        if: ${{ !cancelled() && steps.build-artifacts.outcome == 'success' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/upload-serialized-artifacts.sh

      - name: Upload build output as workflow artifact (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curated-artifacts-meta
          path: |
            dist/curated-artifacts/*/artifact-meta.json
            dist/curated-artifacts/resolved-sources.json
            dist/curated-releases/*/*/artifact-meta.json
            dist/curated-releases/*/resolved-sources.json
          retention-days: 7
