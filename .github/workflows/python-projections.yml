name: Python Projections

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python-projections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Build core and codegen
        run: pnpm --filter '@rune-langium/codegen...' run build
      - name: Check authoritative runtime and target types
        run: |
          node packages/codegen/scripts/generate-python-runtime.mjs --check
          pnpm --filter @rune-langium/codegen run type-check
      - name: Grammar census, syntax, execution parity and inverse lenses
        run: pnpm --filter @rune-langium/codegen exec vitest run test/projection test/lens/python/roundtrip.test.ts test/lens/typescript/roundtrip.test.ts
