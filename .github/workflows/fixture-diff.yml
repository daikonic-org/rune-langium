name: Fixture Diff Gate (SC-007)

on:
  push:
    paths:
      - 'packages/codegen/**'
      - 'packages/core/**'
  pull_request:
    paths:
      - 'packages/codegen/**'
      - 'packages/core/**'

permissions:
  contents: read

jobs:
  fixture-diff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.0

      - name: Use project Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @rune-langium/core run build

      - name: Build instrumentation-core
        # packages/codegen/src/instrument.ts imports @rune-langium/instrumentation-core;
        # tsc -b resolves workspace deps via normal module resolution (this repo
        # has no explicit TS project `references`), so instrumentation-core's
        # dist/ must exist before codegen's own build runs.
        run: pnpm --filter @rune-langium/instrumentation-core run build

      - name: Build codegen
        run: pnpm --filter @rune-langium/codegen run build

      - name: Run fixture-diff tests (SC-007)
        run: pnpm --filter @rune-langium/codegen test fixture
