packages:
  - '.'
  - packages/*
  - apps/*
  - scratch/*

# pnpm 11 requires an explicit build-script decision per dependency, where
# pnpm 10 silently ignored them. All of these were already unbuilt under
# pnpm 10 and CI/builds passed, so keep them off to preserve that behavior:
#   - esbuild / sharp: ship prebuilt platform binaries via optional deps; no
#     postinstall build is needed.
#   - workerd: its binary is fetched on demand by wrangler/miniflare.
#   - msw: the postinstall is a no-op (worker is set up via `msw init`).
#   - simple-git-hooks: hooks are installed by the root `prepare` script.
#   - @l1xnan/tree-sitter-sql / tree-sitter: the SQL reader (spec 021 Phase 2c)
#     only consumes @l1xnan/tree-sitter-sql's prebuilt tree-sitter-sql.wasm
#     file via web-tree-sitter — it never imports the package's native N-API
#     binding (bindings/node), so `tree-sitter`'s own node-gyp/binding.gyp
#     build (pulled in transitively as a peer dependency) is unnecessary.
allowBuilds:
  '@l1xnan/tree-sitter-sql': false
  esbuild: false
  msw: false
  sharp: false
  simple-git-hooks: false
  tree-sitter: false
  workerd: false

minimumReleaseAgeExclude:
  - langium-zod@0.12.2
  - '@zod-to-form/core@0.12.0'
  - '@zod-to-form/react@0.13.0'
  - '@zod-to-form/vite@0.5.0'
  - '@zod-to-form/codegen@0.11.0'
  # PR #353: @lspeasy/client 3.1.5 pulls in @lspeasy/core 2.6.0 as a new
  # transitive resolution; both were too freshly-published for the age gate,
  # which blocked `pnpm install` (not a real breaking change in the bump).
  - '@lspeasy/client@3.1.5'
  - '@lspeasy/core@2.6.0'

# pnpm 10/11 read dependency overrides + patches from here (NOT the package.json
# `pnpm` field, which they ignore). Migrated from package.json so the
# lockfile's overrides match the running config under pnpm@11.x.
overrides:
  zod: 4.6.7
  '@zod-to-form/vite': 0.5.0
  # Exact-pinned (not a caret range) like langium-zod/@zod-to-form below:
  # codegen's sql-node-types.ts is GENERATED from this exact version's
  # shipped src/node-types.json (spec 021 Phase 2c Addendum 2) — a silent
  # version drift would desync the generated file from the installed
  # grammar's real shape. Bump deliberately + regenerate
  # (`pnpm --filter @rune-langium/codegen run generate:sql-node-types`).
  '@l1xnan/tree-sitter-sql': 0.4.7
  # Pin react + react-dom to the SAME exact version. design-system and
  # visual-editor declare react-dom as a floating peer (`react-dom: ">=18.0.0"`),
  # which let react-dom drift to a newer patch (19.2.7) than react (19.2.6).
  # react-dom's dev build hard-asserts exact-same-version, which aborts every
  # React test suite at load (CI: "Failed Suites 51"). The override forces both
  # to one version regardless of the peer ranges.
  react: 19.3.1
  react-dom: 19.3.1
  langium-zod: 0.12.2
  x-to-zod: ^0.8.0
  '@zod-to-form/core': 0.12.0
  '@zod-to-form/react': 0.13.0
  codemirror: 6.0.2
  ws: '>=8.21.0'
  # GHSA-w5hq-g745-h8pq: force transitive uuid off the deprecated/vulnerable
  # 8.3.2 (uuid is purely transitive here — no first-party imports).
  uuid: '>=11.1.1'
  # GHSA-ph9p-34f9-6g65 / CVE-2026-44705: path traversal via unsanitized prefix/postfix
  # in tmp < 0.2.6; purely transitive (no first-party imports).
  tmp: '>=0.2.6'
  # Keep patched Undici 7 scoped to Miniflare without unifying Undici 8 consumers.
  'miniflare>undici': '7.30.0'
  # GHSA-wq5f-xc86-pv6w: patched librsvg in Miniflare's image tooling.
  'miniflare>sharp': '0.35.5'
  # GHSA-pqg4-j6r4-53mv: patched command quoting in the dev process runner.
  'concurrently>shell-quote': '1.12.0'

# Local braces security patch retains version 3.0.3; audit cannot inspect it.
# Remove this single version-based exception with the upstream release (#572).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm

# Published declaration files import type-fest without declaring it.
# Remove after https://github.com/pradeepmouli/lspeasy/issues/307 is fixed.
packageExtensions:
  '@lspeasy/core@3.0.1':
    dependencies:
      type-fest: 5.10.0

# GHSA-vfj7-8cjw-p6xm: structural guards backported from micromatch/braces#82.
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  # Preserve contained-node union setters until langium-zod publishes support.
  langium-zod@0.12.2: patches/langium-zod@0.12.2.patch
